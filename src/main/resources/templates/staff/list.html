<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff List</title>
</head>
<body>
<h1>Staff List</h1>
<a th:href="@{/staff/new}">Add New Staff</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Position</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${staffList}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.email}"></td>
        <td th:text="${s.position}"></td>
        <td>
            <a th:href="@{/staff/edit/{id}(id=${s.id})}">Edit</a>
            <a th:href="@{/staff/delete/{id}(id=${s.id})}"
               onclick="return confirm('Delete this staff?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
